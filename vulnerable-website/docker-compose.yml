services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - db
    environment:
      - MYSQL_HOST=db
      - MYSQL_USER=root
      - MYSQL_PASSWORD=secret
      - MYSQL_DATABASE=financial_news

  db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=secret
      - MYSQL_DATABASE=financial_news
    volumes:
      - mysql_data:/var/lib/mysql
      - ./financial_news.sql:/docker-entrypoint-initdb.d/financial_news.sql

volumes:
  mysql_data: